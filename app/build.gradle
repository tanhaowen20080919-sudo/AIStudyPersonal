plugins { id 'com.android.application' }
def resolvedVersionCode = Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
def resolvedVersionName = System.getenv('APP_VERSION_NAME') ?: '1.0.0'
android {
    namespace 'cn.study.personal'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'cn.study.personal'
        minSdk 26
        targetSdk 35
       versionCode resolvedVersionCode
versionName resolvedVersionName
    }
    signingConfigs {
        personal {
            storeFile file('../signing/personal.jks')
            storePassword System.getenv('SIGNING_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: 'personal'
            keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { minifyEnabled false; signingConfig signingConfigs.personal }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
