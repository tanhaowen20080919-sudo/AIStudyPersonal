name: Build APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "版本名称，例如 1.0.1"
        required: true
        default: "1.0.0"
      version_code:
        description: "版本号，更新时必须比已安装版本大"
        required: true
        default: "1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
      APP_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Check signing secrets
        shell: bash
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "Missing SIGNING_KEYSTORE_BASE64"; exit 1; }
          test -n "$SIGNING_STORE_PASSWORD" || { echo "Missing SIGNING_STORE_PASSWORD"; exit 1; }
          test -n "$SIGNING_KEY_ALIAS" || { echo "Missing SIGNING_KEY_ALIAS"; exit 1; }
          test -n "$SIGNING_KEY_PASSWORD" || { echo "Missing SIGNING_KEY_PASSWORD"; exit 1; }

      - name: Restore private signing key
        shell: bash
        run: |
          mkdir -p signing
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > signing/personal.jks
          chmod 600 signing/personal.jks

      - name: Build signed release APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/StudyPersonal-${APP_VERSION_NAME}-${APP_VERSION_CODE}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyPersonal-${{ env.APP_VERSION_NAME }}-${{ env.APP_VERSION_CODE }}
          path: dist/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --generate-notes --verify-tag
